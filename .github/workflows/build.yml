name: Build APKs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: tv
            label: Android TV
            task: assembleTvRelease
          - flavor: mobile
            label: Mobile
            task: assembleMobileRelease

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The repo has no Gradle wrapper, so pin the version here instead.
      # Keep this in sync with gradle/wrapper/gradle-wrapper.properties.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Build ${{ matrix.label }} release APK
        run: gradle --no-daemon --stacktrace ${{ matrix.task }}

      - name: Verify the APK is signed with the test key
        id: verify
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/${{ matrix.flavor }}/release -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No APK produced for the ${{ matrix.flavor }} flavor"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK"

          NAME="funny-${{ matrix.flavor }}-release-${GITHUB_SHA::7}.apk"
          mv "$APK" "$NAME"
          echo "apk=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload ${{ matrix.label }} APK
        uses: actions/upload-artifact@v4
        with:
          name: funny-${{ matrix.flavor }}-release
          path: ${{ steps.verify.outputs.apk }}
          if-no-files-found: error
          retention-days: 30
